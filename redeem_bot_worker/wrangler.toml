name = "redeem-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Non-secret config (secrets are set separately with `wrangler secret put`)
[vars]
CRYPTO_PAY_API_BASE = "https://pay.crypt.bot/api"
# Comma-separated numeric Telegram user IDs allowed to run admin commands
ADMIN_IDS = "123456789"

# Created with: wrangler d1 create redeem_bot_db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "redeem_bot_db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
